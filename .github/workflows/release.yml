name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Mevcut release etiketi (örn: v0.3.5)'
        required: false
        default: 'v0.3.5'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm etiketini belirle
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.3.5"
            fi
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            desktop/src-tauri

      - name: Bağımlılıklar
        run: npm ci
        working-directory: desktop

      - name: Motor testleri (engine workspace)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace
        working-directory: engine

      - name: Motor derle (release)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --workspace
          mkdir -p target/release
          if [ -f "target/${{ matrix.target }}/release/anticore" ]; then
            cp "target/${{ matrix.target }}/release/anticore" target/release/anticore
            cp "target/${{ matrix.target }}/release/anticore" target/release/anticore.exe
          elif [ -f "target/release/anticore" ]; then
            cp target/release/anticore target/release/anticore.exe
          fi
          if [ -f "target/${{ matrix.target }}/release/anticore.exe" ]; then
            cp "target/${{ matrix.target }}/release/anticore.exe" target/release/anticore.exe
          fi
        working-directory: engine

      - name: Frontend testleri
        run: npm test
        working-directory: desktop

      - name: Frontend derleme (Tauri frontendDist)
        run: npm run build
        working-directory: desktop

      - name: Masaüstü backend testleri
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Derle ve yayınla
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Anticore ${{ env.RELEASE_TAG }}"
          releaseBody: "Sürümlü dağıtım — Windows ve macOS (Apple Silicon & Intel) kurulum paketleri."
          releaseDraft: false
          prerelease: false

      - name: Taşınabilir paket (Portable ZIP) oluştur ve yükle (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ref = "${{ env.RELEASE_TAG }}"
          $ver = $ref.TrimStart('v')
          $pDir = "dist-portable/Anticore"
          New-Item -ItemType Directory -Force -Path $pDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$pDir/bin" | Out-Null

          $desktopExe = "desktop/src-tauri/target/${{ matrix.target }}/release/anticore-desktop.exe"
          if (-not (Test-Path $desktopExe)) {
            $desktopExe = "desktop/src-tauri/target/release/anticore-desktop.exe"
          }
          Copy-Item $desktopExe "$pDir/Anticore.exe" -Force

          $cliExe = "engine/target/${{ matrix.target }}/release/anticore.exe"
          if (-not (Test-Path $cliExe)) {
            $cliExe = "engine/target/release/anticore.exe"
          }
          Copy-Item $cliExe "$pDir/anticore-cli.exe" -Force
          Copy-Item $cliExe "$pDir/bin/anticore.exe" -Force
          Copy-Item "vendor/windows/WinDivert.dll" "$pDir/WinDivert.dll" -Force
          Copy-Item "vendor/windows/WinDivert64.sys" "$pDir/WinDivert64.sys" -Force
          Copy-Item "vendor/windows/WinDivert.dll" "$pDir/bin/WinDivert.dll" -Force
          Copy-Item "vendor/windows/WinDivert64.sys" "$pDir/bin/WinDivert64.sys" -Force
          Copy-Item "vendor/windows/WebView2Loader.dll" "$pDir/WebView2Loader.dll" -Force

          $readme = "=====================================================`r`nANTICORE - Portable (Kurulumsuz) Surum`r`nSifir Hiz Kaybi ile DPI Atlatma`r`n=====================================================`r`nKullanim:`r`n1. 'Anticore.exe' dosyasina sag tiklayip 'Yonetici olarak calistir'i secin.`r`n2. Baslat butonuna basin.`r`n====================================================="
          Set-Content -Path "$pDir/README.txt" -Value $readme -Encoding UTF8

          $zipPath = "dist-portable/Anticore_${ver}_x64-portable.zip"
          Compress-Archive -Path "$pDir/*" -DestinationPath $zipPath -CompressionLevel Optimal
          gh release upload $ref $zipPath --clobber
          gh release upload $ref "$pDir/Anticore.exe" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: macOS Kurulum Paketi (.pkg) Üret ve Yükle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          ref="${{ env.RELEASE_TAG }}"
          ver="${ref#v}"
          arch="${{ matrix.arch }}"
          target="${{ matrix.target }}"

          app_path="desktop/src-tauri/target/${target}/release/bundle/macos/Anticore.app"
          if [ ! -d "$app_path" ]; then
            app_path="desktop/src-tauri/target/release/bundle/macos/Anticore.app"
          fi

          if [ -d "$app_path" ]; then
            bin_path="engine/target/${target}/release/anticore"
            if [ ! -f "$bin_path" ]; then
              bin_path="engine/target/release/anticore"
            fi
            if [ -f "$bin_path" ]; then
              cp "$bin_path" "$app_path/Contents/MacOS/anticore-cli"
              chmod +x "$app_path/Contents/MacOS/anticore-cli"
              cp "$bin_path" "$app_path/Contents/Resources/anticore-cli"
              chmod +x "$app_path/Contents/Resources/anticore-cli"
            fi
            chmod +x scripts/pkg-scripts/postinstall
            chmod -R 755 "$app_path"

            pkg_name="Anticore_${ver}_${arch}.pkg"
            pkgbuild --component "$app_path" \
                     --install-location /Applications \
                     --scripts scripts/pkg-scripts \
                     "$pkg_name"

            gh release upload "$ref" "$pkg_name" --clobber
          else
            echo "UYARI: $app_path bulunamadı, .pkg üretimi atlandı."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: macOS Bağımsız CLI ve Daemon Paketini Hazırla ve Yükle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          ref="${{ env.RELEASE_TAG }}"
          ver="${ref#v}"
          arch="${{ matrix.arch }}"
          target="${{ matrix.target }}"
          pDir="dist-macos-${arch}"
          mkdir -p "$pDir"

          bin_path="engine/target/${target}/release/anticore"
          if [ ! -f "$bin_path" ]; then
            bin_path="engine/target/release/anticore"
          fi

          cp "$bin_path" "$pDir/anticore-cli"
          cp scripts/macos-install-daemon.sh "$pDir/"
          chmod +x "$pDir/anticore-cli" "$pDir/macos-install-daemon.sh"

          tar_name="anticore-cli-macos-${arch}-${ver}.tar.gz"
          tar -czf "$tar_name" -C "$pDir" anticore-cli macos-install-daemon.sh
          gh release upload "$ref" "$tar_name" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: Dağıtım Paketlerini İmzala ve latest.json Yayınla
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm etiketini belirle
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.3.7"
            fi
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıklar (Tauri CLI)
        run: npm ci
        working-directory: desktop

      - name: Dağıtım paketlerini indir, imzala ve latest.json yayınla
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ref="${{ env.RELEASE_TAG }}"
          ver="${ref#v}"
          mkdir -p dist_release
          cd dist_release

          echo "GitHub Release paketleri indiriliyor: $ref..."
          gh release download "$ref" --pattern "Anticore_*" || true

          sign_asset() {
            local file="$1"
            if [ -f "$file" ]; then
              echo "İmzalanıyor: $file" >&2
              npx --prefix ../desktop tauri signer sign -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$file" >&2
              if [ -f "${file}.sig" ]; then
                cat "${file}.sig"
              fi
            else
              echo "Dosya bulunamadı: $file" >&2
            fi
          }

          SETUP_EXE="Anticore_${ver}_x64-setup.exe"
          MSI_FILE="Anticore_${ver}_x64_en-US.msi"
          MAC_ARM64="Anticore_${ver}_arm64.pkg"
          MAC_X64="Anticore_${ver}_x64.pkg"

          export VER="$ver"
          export REF="$ref"
          export SIG_SETUP="$(sign_asset "$SETUP_EXE")"
          export SIG_MSI="$(sign_asset "$MSI_FILE")"
          export SIG_ARM64="$(sign_asset "$MAC_ARM64")"
          export SIG_X64="$(sign_asset "$MAC_X64")"

          node -e '
            const fs = require("fs");
            const ver = process.env.VER;
            const ref = process.env.REF;
            const sigSetup = (process.env.SIG_SETUP || "").trim();
            const sigMsi = (process.env.SIG_MSI || "").trim();
            const sigArm64 = (process.env.SIG_ARM64 || "").trim();
            const sigX64 = (process.env.SIG_X64 || "").trim();

            const manifest = {
              version: ver,
              notes: `Anticore ${ref} — Canlı tünel motoru, DPI atlatma, OTA otomatik güncelleme ve çoklu platform desteği.`,
              pub_date: new Date().toISOString(),
              platforms: {}
            };

            const base = `https://github.com/MonarchDevLab/Anticore/releases/download/${ref}`;

            if (sigSetup) {
              manifest.platforms["windows-x86_64"] = {
                signature: sigSetup,
                url: `${base}/Anticore_${ver}_x64-setup.exe`
              };
              manifest.platforms["windows-x86_64-nsis"] = {
                signature: sigSetup,
                url: `${base}/Anticore_${ver}_x64-setup.exe`
              };
            }
            if (sigMsi) {
              manifest.platforms["windows-x86_64-msi"] = {
                signature: sigMsi,
                url: `${base}/Anticore_${ver}_x64_en-US.msi`
              };
            }
            if (sigArm64) {
              manifest.platforms["darwin-aarch64"] = {
                signature: sigArm64,
                url: `${base}/Anticore_${ver}_arm64.pkg`
              };
            }
            if (sigX64) {
              manifest.platforms["darwin-x86_64"] = {
                signature: sigX64,
                url: `${base}/Anticore_${ver}_x64.pkg`
              };
            }

            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2), "utf8");
            console.log("Oluşturulan latest.json içeriği:");
            console.log(JSON.stringify(manifest, null, 2));
          '

          echo "latest.json GitHub Release üzerine yükleniyor..."
          gh release upload "$ref" latest.json --clobber

          echo "İmza (.sig) dosyaları GitHub Release üzerine yükleniyor..."
          for sig in *.sig; do
            if [ -f "$sig" ]; then
              gh release upload "$ref" "$sig" --clobber
            fi
          done
