name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Mevcut release etiketi (örn: v0.3.1)'
        required: false
        default: 'v0.3.1'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm etiketini belirle
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.3.1"
            fi
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            desktop/src-tauri

      - name: Bağımlılıklar
        run: npm ci
        working-directory: desktop

      - name: Motor testleri (engine workspace)
        run: cargo test --workspace
        working-directory: engine

      - name: Motor derle (release)
        shell: bash
        run: |
          cargo build --release --workspace
          # macOS üzerinde tauri.conf.json resource uyumu için kopyala
          if [ -f "target/release/anticore" ]; then
            cp target/release/anticore target/release/anticore.exe
          fi
        working-directory: engine

      - name: Masaüstü backend testleri
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Frontend testleri
        run: npm test
        working-directory: desktop

      - name: Derle ve yayınla
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Anticore ${{ env.RELEASE_TAG }}"
          releaseBody: "Sürümlü dağıtım — Windows ve macOS kurulum paketleri."
          releaseDraft: false
          prerelease: false

      - name: Taşınabilir paket (Portable ZIP) oluştur ve yükle (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ref = "${{ env.RELEASE_TAG }}"
          $ver = $ref.TrimStart('v')
          $pDir = "dist-portable/Anticore"
          New-Item -ItemType Directory -Force -Path $pDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$pDir/bin" | Out-Null

          Copy-Item "desktop/src-tauri/target/release/anticore-desktop.exe" "$pDir/Anticore.exe" -Force
          Copy-Item "engine/target/release/anticore.exe" "$pDir/anticore-cli.exe" -Force
          Copy-Item "engine/target/release/anticore.exe" "$pDir/bin/anticore.exe" -Force
          Copy-Item "vendor/windows/WinDivert.dll" "$pDir/WinDivert.dll" -Force
          Copy-Item "vendor/windows/WinDivert64.sys" "$pDir/WinDivert64.sys" -Force
          Copy-Item "vendor/windows/WinDivert.dll" "$pDir/bin/WinDivert.dll" -Force
          Copy-Item "vendor/windows/WinDivert64.sys" "$pDir/bin/WinDivert64.sys" -Force
          Copy-Item "vendor/windows/WebView2Loader.dll" "$pDir/WebView2Loader.dll" -Force

          $readme = "=====================================================`r`nANTICORE - Portable (Kurulumsuz) Surum`r`nSifir Hiz Kaybi ile DPI Atlatma`r`n=====================================================`r`nKullanim:`r`n1. 'Anticore.exe' dosyasina sag tiklayip 'Yonetici olarak calistir'i secin.`r`n2. Baslat butonuna basin.`r`n====================================================="
          Set-Content -Path "$pDir/README.txt" -Value $readme -Encoding UTF8

          $zipPath = "dist-portable/Anticore_${ver}_x64-portable.zip"
          Compress-Archive -Path "$pDir/*" -DestinationPath $zipPath -CompressionLevel Optimal
          gh release upload $ref $zipPath --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: macOS Bağımsız CLI ve Daemon Paketini Hazırla ve Yükle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          ref="${{ env.RELEASE_TAG }}"
          ver="${ref#v}"
          mkdir -p dist-macos
          cp engine/target/release/anticore dist-macos/anticore-cli
          cp scripts/macos-install-daemon.sh dist-macos/
          tar -czf "dist-macos/anticore-cli-macos-${ver}.tar.gz" -C dist-macos anticore-cli macos-install-daemon.sh
          gh release upload "$ref" "dist-macos/anticore-cli-macos-${ver}.tar.gz" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
