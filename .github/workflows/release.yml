name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            desktop/src-tauri

      - name: Bağımlılıklar
        run: npm ci
        working-directory: desktop

      - name: Motor testleri (engine workspace)
        run: cargo test --workspace
        working-directory: engine

      - name: Masaüstü backend testleri
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Frontend testleri
        run: npm test
        working-directory: desktop

      - name: Motor derle (release)
        # tauri.conf.json bundle.resources bu ikiliyi bekler:
        # ../../engine/target/release/anticore.exe — bu adım olmadan
        # tauri-action bundling "kaynak dosya bulunamadı" hatasıyla düşer.
        run: cargo build --release --workspace
        working-directory: engine

      - name: Derle ve yayınla
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Anticore ${{ github.ref_name }}"
          releaseBody: "Sürümlü dağıtım — kurulum ve otomatik güncelleme paketleri."
          releaseDraft: false
          prerelease: false

      - name: Taşınabilir paket (Portable ZIP) oluştur ve yükle
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $pDir = "dist-portable/Anticore"
          New-Item -ItemType Directory -Force -Path $pDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$pDir/bin" | Out-Null

          Copy-Item "desktop/src-tauri/target/release/anticore-desktop.exe" "$pDir/Anticore.exe" -Force
          Copy-Item "engine/target/release/anticore.exe" "$pDir/anticore-cli.exe" -Force
          Copy-Item "engine/target/release/anticore.exe" "$pDir/bin/anticore.exe" -Force
          Copy-Item "vendor/windows/WinDivert.dll" "$pDir/WinDivert.dll" -Force
          Copy-Item "vendor/windows/WinDivert64.sys" "$pDir/WinDivert64.sys" -Force
          Copy-Item "vendor/windows/WinDivert.dll" "$pDir/bin/WinDivert.dll" -Force
          Copy-Item "vendor/windows/WinDivert64.sys" "$pDir/bin/WinDivert64.sys" -Force
          Copy-Item "vendor/windows/WebView2Loader.dll" "$pDir/WebView2Loader.dll" -Force

          $readme = @"
          =====================================================
          ANTICORE - Portable (Kurulumsuz) Sürüm
          Sıfır Hız Kaybı ile DPI Atlatma
          =====================================================
          Kullanım:
          1. 'Anticore.exe' dosyasına sağ tıklayıp 'Yönetici olarak çalıştır'ı seçin.
          2. Başlat butonuna basın.
          =====================================================
          "@
          Set-Content -Path "$pDir/README.txt" -Value $readme -Encoding UTF8

          $zipPath = "dist-portable/Anticore_${ver}_x64-portable.zip"
          Compress-Archive -Path "$pDir/*" -DestinationPath $zipPath -CompressionLevel Optimal
          gh release upload ${{ github.ref_name }} $zipPath --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
