[build]
rustflags = [
    "--remap-path-prefix=C:/Users=~",
    "--remap-path-prefix=C:\\Users=~",
    "--remap-path-prefix=c:/Users=~",
    "--remap-path-prefix=c:\\Users=~",
    "--remap-path-prefix=E:/Personel=~",
    "--remap-path-prefix=E:\\Personel=~",
    "--remap-path-prefix=e:/Personel=~",
    "--remap-path-prefix=e:\\Personel=~",
    "--remap-path-prefix=E:/=~",
    "--remap-path-prefix=E:\\=~",
    "--remap-path-prefix=e:/=~",
    "--remap-path-prefix=e:\\=~",
    "--remap-path-prefix=D:/=~",
    "--remap-path-prefix=D:\\=~",
]
