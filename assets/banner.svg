<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090D"/>
      <stop offset="50%" stop-color="#0C1017"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>

    <!-- Text Metallic Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Shield Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect width="880" height="260" rx="16" fill="url(#grid)"/>
  <rect width="880" height="260" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Radial Glow Behind Center -->
  <circle cx="440" cy="95" r="160" fill="url(#auraGlow)"/>

  <!-- Corner Brackets (Cyber / Hardware aesthetic) -->
  <path d="M 20 35 L 20 20 L 35 20" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 860 35 L 860 20 L 845 20" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 20 225 L 20 240 L 35 240" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 860 225 L 860 240 L 845 240" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- Top Pill Badge: Zero-Loss / Calibrated -->
  <g transform="translate(440, 36)">
    <rect x="-160" y="-12" width="320" height="24" rx="12" fill="#00FF9D" fill-opacity="0.08" stroke="#00FF9D" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="-144" cy="0" r="3.5" fill="#00FF9D"/>
    <text x="-132" y="4" fill="#00FF9D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-transform="uppercase">TURKISH ISP CALIBRATED • ZERO SPEED LOSS</text>
  </g>

  <!-- Logo Icon: Modern Shield with Core Reactor -->
  <g transform="translate(440, 85)">
    <!-- Shield Outer Trace -->
    <path d="M 0 -28 L 24 -14 L 24 10 C 24 24 0 34 0 34 C 0 34 -24 24 -24 10 L -24 -14 Z"
          fill="#0C131D" stroke="url(#liveGrad)" stroke-width="2" filter="url(#neonGlow)"/>

    <!-- Inner Core Reactor -->
    <circle cx="0" cy="4" r="8" fill="#00FF9D" fill-opacity="0.2" stroke="#00FF9D" stroke-width="1.5"/>
    <circle cx="0" cy="4" r="3" fill="#00FF9D"/>

    <!-- Orbital Traces -->
    <ellipse cx="0" cy="4" rx="15" ry="5" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6" transform="rotate(-25, 0, 4)"/>
    <ellipse cx="0" cy="4" rx="15" ry="5" fill="none" stroke="#00FF9D" stroke-width="1" stroke-opacity="0.6" transform="rotate(25, 0, 4)"/>
  </g>

  <!-- Brand Typography: ANTICORE -->
  <text x="440" y="162" text-anchor="middle" fill="url(#textGrad)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="900" letter-spacing="9">ANTICORE</text>

  <!-- Subtitle: High Precision DPI Bypass -->
  <text x="440" y="190" text-anchor="middle" fill="#94A3B8"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="11.5" font-weight="600" letter-spacing="3.2">
    ZERO-LOSS DPI CIRCUMVENTION &amp; PACKET MANIPULATION SUITE
  </text>

  <!-- Bottom Feature Specs -->
  <g transform="translate(440, 222)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.2">
    <text x="-210" y="0" text-anchor="middle" fill="#64748B">KERNEL-LEVEL L3/L4/L7</text>
    <circle cx="-120" cy="-3.5" r="1.5" fill="#334155"/>
    <text x="-30" y="0" text-anchor="middle" fill="#64748B">RUST + WINDIVERT</text>
    <circle cx="60" cy="-3.5" r="1.5" fill="#334155"/>
    <text x="145" y="0" text-anchor="middle" fill="#64748B">TAURI 2.0 GUI</text>
    <circle cx="215" cy="-3.5" r="1.5" fill="#334155"/>
    <text x="255" y="0" text-anchor="middle" fill="#00FF9D" font-weight="700">v0.3.4</text>
  </g>
</svg>
