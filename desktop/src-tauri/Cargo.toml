[package]
name = "anticore-desktop"
version = "0.3.6"
edition = "2021"
license = "MIT"
authors = ["Monolith Works <info@monolithworks.com.tr>"]
description = "High-performance DPI bypass and network filtering platform for Windows"
repository = "https://github.com/MonarchDevLab/Anticore"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anticore-core = { path = "../../engine/crates/anticore-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
ureq = { version = "2", features = ["json"] }
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
lru = "0.12"

[target.'cfg(windows)'.dependencies]
anticore-transport-win = { path = "../../engine/crates/anticore-transport-win" }
windows-registry = "0.6"
windows = { version = "0.52", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Networking_WinSock"
] }

[target.'cfg(target_os = "macos")'.dependencies]
anticore-transport-macos = { path = "../../engine/crates/anticore-transport-macos" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
